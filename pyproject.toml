[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-swarm"
version = "0.4.0"
description = "MCP servers extracted from the trading swarm: point-in-time data, pre-trade invariant + leakage audits, regime-fragility probes, and the Shadow Tournament bridge that scores your genome against the swarm's live champion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The 1.21 Initiative" }]
keywords = ["mcp", "trading", "backtest-audit", "point-in-time", "regimes", "tournament", "evolution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]
remote = ["uvicorn>=0.30", "starlette>=0.37"]

[project.scripts]
swarm-data-mcp = "swarm_mcp.servers.data_server:main"
swarm-warden-mcp = "swarm_mcp.servers.warden_server:main"
swarm-gym-mcp = "swarm_mcp.servers.gym_server:main"
swarm-mcp-http = "swarm_mcp.servers.http_server:main"

[project.urls]
Homepage = "https://github.com/blink1217/trading-swarm-mcp"

[tool.setuptools.packages.find]
include = ["swarm_mcp*"]

[tool.setuptools.package-data]
"swarm_mcp.vendored.guardrails" = ["*.json", "*.md"]
"swarm_mcp.vendored.alpha" = ["*.md"]
"swarm_mcp.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
